[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umn-gopher-ai-knowledge"
version = "0.1.0"
description = "Deterministic, evidence-first campus knowledge retrieval"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
dependencies = [
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "psycopg-pool==3.3.1",
  "pydantic==2.13.4",
  "tzdata==2026.3; sys_platform == 'win32'",
  "uvicorn==0.52.1",
]

[project.scripts]
ai-knowledge-sync = "ai_knowledge.sync:main"

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.2",
]

[tool.setuptools.packages.find]
include = ["ai_knowledge*"]

[tool.setuptools.package-data]
ai_knowledge = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=ai_knowledge --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "integration: requires a migrated disposable PostgreSQL 17/pgvector database supplied by the caller",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.coverage.run]
branch = true
source = ["ai_knowledge"]

[tool.coverage.report]
fail_under = 95
show_missing = true
