openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Campus Assistant API
  version: 0.1.0
  summary: Contract for an independent five-campus bilingual assistant
  description: |
    This API is independent and unofficial. A source URL identifies provenance; it does not imply
    an institutional partnership. Connector-backed operations remain gated until authorization,
    licensing, privacy, accessibility, and operational reviews are complete.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
  - name: Catalog
  - name: Routing
  - name: Worlds
  - name: Community
  - name: AI
  - name: Academics
  - name: Personal Vault
  - name: Messages
  - name: Live Events
  - name: Moderation
  - name: Admin
paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      x-runtime-status: implemented
      summary: Return process liveness
      description: |
        This anonymous endpoint proves that the HTTP process can serve requests. It is not a
        production readiness signal and does not probe the DPoP replay Redis service, personal-vault
        PostgreSQL, the identity provider, or optional catalog and AI dependencies.
      security: []
      responses:
        "200":
          description: HTTP process is live
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/campuses:
    get:
      tags: [Catalog]
      operationId: listCampuses
      x-runtime-status: implemented
      summary: List supported campuses and academic-calendar mappings
      security: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Supported campuses
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campus"
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/sources:
    get:
      tags: [Catalog]
      operationId: listSources
      x-runtime-status: implemented
      summary: List provenance and connector-policy descriptors
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of source descriptors
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/events:
    get:
      tags: [Catalog]
      operationId: listEvents
      x-runtime-status: implemented
      summary: List normalized public events
      description: |
        Returns a bounded, transient view from a reviewed live source. `campusId` is required.
        `from` and `to` must be supplied together and span at most 183 days. When both are omitted,
        the server uses a disclosed 120-day America/Chicago window. Each request fetches at most
        three upstream pages on demand; `retrievalCoverage` discloses the partial live view and any
        source-policy truncation. Cursors bind the query and the revalidated upstream page snapshot,
        so a changed page returns 410 instead of silently mixing snapshots. LIVE_ONLY content is
        never cached and cross-page snapshot consistency is not claimed. A signed cursor also carries
        the accepted raw-byte traversal total. The 8 MiB accepted-content budget is checked after each
        independently 2 MiB-capped fetch; a crossing page is discarded, never returned, and terminates
        traversal with `truncatedByPolicy=true`. A single response never contains duplicate event IDs:
        byte-identical cross-page duplicates are skipped and conflicting duplicates fail closed. Because
        this LIVE_ONLY cursor is stateless, a distant overlap may repeat an identical ID in a later response;
        clients merging cursor pages must drop semantically identical IDs and reject conflicting content.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequiredCampusQuery"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of events
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "304":
          $ref: "#/components/responses/LiveCatalogNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/places:
    get:
      tags: [Catalog]
      operationId: listPlaces
      x-runtime-status: contract-only
      summary: List public places with provenance and verification state
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - name: query
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of places
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/routes:
    post:
      tags: [Routing]
      operationId: calculateRoute
      x-runtime-status: contract-only
      summary: Calculate a provenance-bound campus route
      description: |
        Safety-critical and accessibility routing must return 503 until its topology and operating
        procedure are verified. A schematic response must never be presented as verified guidance.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route result
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/worlds/{campusId}/manifest:
    get:
      tags: [Worlds]
      operationId: getWorldManifest
      x-runtime-status: implemented
      summary: Return a versioned schematic or verified world manifest
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusPath"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: World manifest; verificationState controls product labeling
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusWorldManifest"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/community/posts:
    get:
      tags: [Community]
      operationId: listCommunityPosts
      x-runtime-status: contract-only
      summary: List moderated community posts
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor page of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Community]
      operationId: createCommunityPost
      x-runtime-status: contract-only
      summary: Submit a post to the moderation pipeline
      security:
        - oauth2: [community:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityPost"
      responses:
        "201":
          description: Post accepted
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/ai/query:
    post:
      tags: [AI]
      operationId: queryCampusAssistant
      x-runtime-status: implemented
      x-uga-response-request-bindings: [campusId, locale]
      summary: Query the public bilingual campus retrieval assistant
      description: |
        Performs deterministic no-key hybrid retrieval over project-authored campus summaries. Every non-empty
        answer is backed by a project-authored summary, citations are confined to the requested campus, and
        stale or conflicting summaries are disclosed as a response state instead of being elevated to official
        fact. Each citation separates the reusable project-authored text from an official UMN link supplied
        only so a user can verify the summary; the linked official content is not retrieved or reproduced. The response
        contract requires unique paragraph and citation IDs, resolvable paragraph citation references,
        no unused citations, a `schematic` summary verification state, empty evidence for `no-results`, only
        FRESH summaries for `answered`, only STALE or EXPIRED summaries for `stale`, and genuinely different
        authored documents, official verification links, and content hashes for `conflict`. Queries are
        NFC-normalized plain text without control characters or HTML encodings.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQueryRequest"
      responses:
        "200":
          description: Grounded assistant response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/AiTooManyRequests"
        "503":
          $ref: "#/components/responses/AiUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/academics/sessions:
    get:
      tags: [Academics]
      operationId: listAcademicSessions
      x-runtime-status: implemented
      summary: List normalized academic sessions for one campus
      description: |
        Uses only reviewed, explicit UMN term IDs and never performs an unfiltered Sessions request.
        `from` and `to` must be supplied together and span at most 183 days. When omitted, the server
        uses and discloses a 120-day America/Chicago window. Unsupported term windows fail closed.
        The upstream dataset is revalidated for every request, including conditional requests, so
        callers must tolerate official-source latency and 503 degradation to the supplied official URL.
      security: []
      parameters:
        - $ref: "#/components/parameters/RequiredCampusQuery"
        - $ref: "#/components/parameters/FromDate"
        - $ref: "#/components/parameters/ToDate"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of academic sessions
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicSessionPage"
        "304":
          $ref: "#/components/responses/LiveCatalogNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/CursorExpired"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/personal/vault/bootstrap:
    get:
      tags: [Personal Vault]
      operationId: bootstrapPersonalVault
      x-runtime-status: implemented
      summary: Bootstrap the authenticated account-bound encrypted vault
      description: |
        Returns only the opaque account binding needed to construct a client-side encrypted vault
        and minimal existence metadata. For an existing vault it also returns only the current public
        recovery-authorization descriptor so a fresh device can validate a high-entropy recovery code
        before making a recovery-signed read. It never returns the OIDC subject, internal account ID,
        authorization manifest, encrypted payload, key envelopes, device list, or any private plaintext.
      security:
        - oauth2: [personal:read]
      responses:
        "200":
          description: Account binding and minimal personal-vault existence metadata
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalVaultBootstrapV2"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/personal/vault:
    get:
      tags: [Personal Vault]
      operationId: readPersonalVault
      x-runtime-status: implemented
      x-uga-max-success-response-body-bytes: 16777216
      summary: Read the current encrypted vault snapshot
      description: |
        Requires a fresh, single-use Ed25519 proof from a device or recovery authorization key
        already present in the current manifest. The proof is consumed even when `If-None-Match`
        produces 304. The server validates authenticated metadata and signatures but cannot decrypt
        the payload, wrapped root key, or private records.
      security:
        - oauth2: [personal:read]
      parameters:
        - $ref: "#/components/parameters/VaultReadProof"
        - $ref: "#/components/parameters/VaultIfNoneMatch"
      responses:
        "200":
          description: Current account-bound encrypted vault snapshot
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/StrongETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSyncSnapshotV2"
        "304":
          $ref: "#/components/responses/VaultNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Personal Vault]
      operationId: createPersonalVault
      x-runtime-status: implemented
      x-uga-idempotency-key-bound-to: operationId
      x-uga-max-request-body-bytes: 16777216
      x-uga-max-success-response-body-bytes: 16777216
      summary: Create the authenticated account's encrypted vault
      description: |
        Creates one genesis snapshot. `If-None-Match` must be exactly `*`; the
        `Idempotency-Key` must exactly equal the command's canonical UUID `operationId`.
        An existing account vault fails the create precondition with 412; 409 is reserved for
        idempotency-key reuse with different content or another non-precondition state conflict.
      security:
        - oauth2: [personal:write]
      parameters:
        - $ref: "#/components/parameters/VaultCreateIfNoneMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultCreateCommandV2"
      responses:
        "201":
          description: Genesis vault snapshot
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/StrongETag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              schema: { type: string, const: /v1/personal/vault }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultSyncSnapshotV2"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/personal/vault/payload:
    put:
      tags: [Personal Vault]
      operationId: updatePersonalVaultPayload
      x-runtime-status: implemented
      x-uga-idempotency-key-bound-to: operationId
      x-uga-max-request-body-bytes: 16777216
      x-uga-max-success-response-body-bytes: 16777216
      summary: Commit a new encrypted personal-vault payload
      description: |
        Requires exactly one strong `If-Match` validator. A stale validator returns 412 and never
        merges ciphertext server-side. The `Idempotency-Key` must equal the command `operationId`.
      security:
        - oauth2: [personal:write]
      parameters:
        - $ref: "#/components/parameters/VaultIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultUpdatePayloadCommandV2"
      responses:
        "200":
          $ref: "#/components/responses/VaultSnapshotMutationSucceeded"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/personal/vault/device-pairings:
    get:
      tags: [Personal Vault]
      operationId: listPersonalVaultDevicePairings
      x-runtime-status: implemented
      summary: List bounded device-pairing requests for the current vault
      security:
        - oauth2: [personal:read]
      parameters:
        - $ref: "#/components/parameters/VaultIfNoneMatch"
      responses:
        "200":
          description: Pairing requests owned by the authenticated account
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/StrongETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairingPageV2"
        "304":
          $ref: "#/components/responses/VaultNotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Personal Vault]
      operationId: createPersonalVaultDevicePairing
      x-runtime-status: implemented
      x-uga-idempotency-key-bound-to: operationId
      x-uga-max-request-body-bytes: 16777216
      summary: Create a short-lived request to add a new device
      description: |
        The pending device proves possession of both public-key identities. At most eight
        unexpired pairing requests may coexist for one vault, and pairing is rejected once the
        authorization manifest has reached its 32-device descriptor limit.
      security:
        - oauth2: [personal:write]
      parameters:
        - $ref: "#/components/parameters/VaultIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePairingRequestV2"
      responses:
        "201":
          description: Pending device-pairing request
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/StrongETag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            Location:
              schema:
                type: string
                pattern: "^/v1/personal/vault/device-pairings/[0-9a-f-]{36}$"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePairingViewV2"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/personal/vault/device-pairings/{pairingId}:
    delete:
      tags: [Personal Vault]
      operationId: cancelPersonalVaultDevicePairing
      x-runtime-status: implemented
      summary: Cancel one pending device-pairing request
      security:
        - oauth2: [personal:write]
      parameters:
        - $ref: "#/components/parameters/PairingIdPath"
        - $ref: "#/components/parameters/VaultIfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled pairing representation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            ETag:
              $ref: "#/components/headers/StrongETag"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
