openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Campus Assistant API
  version: 0.1.0
  summary: Contract for an independent five-campus bilingual assistant
  description: |
    This API is independent and unofficial. A source URL identifies provenance; it does not imply
    an institutional partnership. Connector-backed operations remain gated until authorization,
    licensing, privacy, accessibility, and operational reviews are complete.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:4000
    description: Local development
tags:
  - name: System
  - name: Catalog
  - name: Routing
  - name: Worlds
  - name: Community
  - name: AI
  - name: Academics
  - name: Messages
  - name: Live Events
  - name: Moderation
  - name: Admin
security:
  - oauth2: []
paths:
  /v1/health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Return process health
      security: []
      responses:
        "200":
          description: Service is ready
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/campuses:
    get:
      tags: [Catalog]
      operationId: listCampuses
      summary: List supported campuses and academic-calendar mappings
      security: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Supported campuses
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campus"
        "304":
          $ref: "#/components/responses/NotModified"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/sources:
    get:
      tags: [Catalog]
      operationId: listSources
      summary: List provenance and connector-policy descriptors
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of source descriptors
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourcePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/events:
    get:
      tags: [Catalog]
      operationId: listEvents
      summary: List normalized public events
      description: Contract-only until an approved connector is enabled.
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of events
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/places:
    get:
      tags: [Catalog]
      operationId: listPlaces
      summary: List public places with provenance and verification state
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - name: query
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of places
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/routes:
    post:
      tags: [Routing]
      operationId: calculateRoute
      summary: Calculate a provenance-bound campus route
      description: |
        Safety-critical and accessibility routing must return 503 until its topology and operating
        procedure are verified. A schematic response must never be presented as verified guidance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Route result
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/worlds/{campusId}/manifest:
    get:
      tags: [Worlds]
      operationId: getWorldManifest
      summary: Return a versioned schematic or verified world manifest
      security: []
      parameters:
        - $ref: "#/components/parameters/CampusPath"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: World manifest; verificationState controls product labeling
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampusWorldManifest"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /v1/community/posts:
    get:
      tags: [Community]
      operationId: listCommunityPosts
      summary: List moderated community posts
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor page of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPostPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Community]
      operationId: createCommunityPost
      summary: Submit a post to the moderation pipeline
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityPost"
      responses:
        "201":
          description: Post accepted
          headers:
            Location:
              schema: { type: string, format: uri-reference }
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityPost"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/ai/query:
    post:
      tags: [AI]
      operationId: queryAssistant
      summary: Query the bilingual retrieval assistant
      description: Answers must expose citations and must not elevate unverified data to official fact.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiQuery"
      responses:
        "200":
          description: Grounded assistant response
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/academics/courses:
    get:
      tags: [Academics]
      operationId: listAcademicCourses
      summary: List institution-scoped academic course metadata
      description: Contract-only until an approved academic connector is enabled.
      security:
        - oauth2: [campus:read]
      parameters:
        - $ref: "#/components/parameters/CampusQuery"
        - $ref: "#/components/parameters/AcademicInstitutionQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of course metadata
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicCoursePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ConnectorUnavailable"
  /v1/messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages visible to the authenticated user
      security:
        - oauth2: [messages:read, personal:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: Cursor page of private messages
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Messages]
      operationId: createMessage
      summary: Send a private message through the moderated delivery pipeline
      security:
        - oauth2: [messages:write, personal:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessage"
      responses:
        "201":
          description: Message accepted for delivery
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/live-events/{eventId}/join:
    post:
      tags: [Live Events]
      operationId: joinLiveEvent
      summary: Issue a short-lived, device-bound live-event join ticket
      security:
        - oauth2: [world:write, personal:read]
      parameters:
        - $ref: "#/components/parameters/EventIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LiveEventJoinRequest"
      responses:
        "200":
          description: Short-lived join ticket
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorldJoinTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /v1/moderation/cases:
    get:
      tags: [Moderation]
      operationId: listModerationCases
      summary: List moderation cases authorized for the reviewer
      security:
        - oauth2: [community:write, admin:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cursor page of moderation cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCasePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/admin/sources/{sourceId}:
    patch:
      tags: [Admin]
      operationId: updateSourcePolicy
      summary: Update reviewed source-policy metadata
      description: This operation cannot enable a connector or establish official status without external evidence.
      security:
        - oauth2: [admin:write, campus:write]
      parameters:
        - $ref: "#/components/parameters/SourceIdPath"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourcePolicyUpdate"
      responses:
        "200":
          description: Updated source descriptor
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceDescriptor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Local Keycloak in development; production issuer is deployment-specific.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/gopher-assistant-dev/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/gopher-assistant-dev/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect
            profile: Basic profile
            campus:read: Read campus-scoped public and approved data
            campus:write: Modify reviewed campus-scoped metadata
            personal:read: Read the authenticated user's private data
            personal:write: Modify the authenticated user's private data
            community:read: Read authenticated community resources
            community:write: Create or moderate community resources
            messages:read: Read private messages for the authenticated user
            messages:write: Send private messages as the authenticated user
            world:read: Read authenticated world-session resources
            world:write: Join or publish to authorized world sessions
            admin:read: Read administrative review resources
            admin:write: Modify administrative policy resources
  parameters:
    CampusPath:
      name: campusId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CampusId"
    CampusQuery:
      name: campusId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CampusId"
    AcademicInstitutionQuery:
      name: academicInstitutionCode
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AcademicInstitutionCode"
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SourceIdPath:
      name: sourceId
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as nextCursor; clients must not parse or modify it.
      schema: { type: string, minLength: 1, maxLength: 2048 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional request validator from a previous ETag response.
      schema: { type: string, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique opaque key retained for 24 hours; reuse with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: "^[A-Za-z0-9._:-]+$" }
  headers:
    ETag:
      description: Entity tag for conditional requests.
      schema: { type: string }
    RequestId:
      description: Correlation ID suitable for support, not an authentication credential.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IdempotencyReplayed:
      description: True when the response is a replay of a prior request with the same key and body.
      schema: { type: boolean }
  responses:
    NotModified:
      description: Representation has not changed; response has no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication is required or invalid
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated principal lacks the required scope or resource authorization
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource was not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or idempotency-key conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Semantically invalid or policy-disallowed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ConnectorUnavailable:
      description: Required connector is disabled, unapproved, or temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalServerError:
      description: Unexpected server failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CampusId:
      type: string
      enum: [tc, duluth, crookston, morris, rochester]
    AcademicInstitutionCode:
      type: string
      enum: [UMNTC, UMNDL, UMNCR, UMNMO]
    BilingualText:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      properties:
        en: { type: string, minLength: 1 }
        zh-CN: { type: string, minLength: 1 }
    LicenseStatus:
      type: string
      enum: [OPEN_REUSE, LIVE_ONLY, DEEPLINK_ONLY, APPROVAL_REQUIRED, PROHIBITED]
    FreshnessState:
      type: string
      enum: [FRESH, STALE, EXPIRED, UNKNOWN]
    VerificationState:
      type: string
      enum: [schematic, surveyed, campus-reviewed, verified, retired]
    OfficialStatus:
      type: string
      enum: [UNVERIFIED, PUBLISHER_ASSERTED, PARTNERSHIP_VERIFIED]
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, time]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: campus-api }
        version: { type: string }
        time: { type: string, format: date-time }
    Campus:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          city,
          timeZone,
          academicInstitutionCode,
          academicCalendarCampusId,
          sourceUrl,
          officialStatus,
        ]
      properties:
        id: { $ref: "#/components/schemas/CampusId" }
        name: { $ref: "#/components/schemas/BilingualText" }
        city: { $ref: "#/components/schemas/BilingualText" }
        timeZone: { type: string }
        academicInstitutionCode: { $ref: "#/components/schemas/AcademicInstitutionCode" }
        academicCalendarCampusId: { $ref: "#/components/schemas/CampusId" }
        sourceUrl: { type: string, format: uri, pattern: "^https://" }
        officialStatus: { $ref: "#/components/schemas/OfficialStatus" }
    SourceDescriptor:
      type: object
      additionalProperties: false
      required:
        [
          id,
          campusIds,
          name,
          publisher,
          sourceUrl,
          licenseStatus,
          freshnessState,
          verificationState,
          officialStatus,
          attribution,
          cachePolicy,
          lastCheckedAt,
        ]
      properties:
        id: { type: string }
        campusIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CampusId" }
        name: { $ref: "#/components/schemas/BilingualText" }
        publisher: { type: string }
        sourceUrl: { type: string, format: uri, pattern: "^https://" }
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        freshnessState: { $ref: "#/components/schemas/FreshnessState" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        officialStatus: { $ref: "#/components/schemas/OfficialStatus" }
        attribution: { type: string, minLength: 1 }
        cachePolicy:
          type: string
          enum: [CACHE_ALLOWED, METADATA_ONLY, NO_CONTENT_CACHE, NO_ACCESS]
        lastCheckedAt: { type: [string, "null"], format: date-time }
      allOf:
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: PROHIBITED }
          then:
            properties:
              cachePolicy: { const: NO_ACCESS }
    SourcePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SourceDescriptor" }
    Event:
      type: object
      additionalProperties: false
      required: [id, campusId, title, startsAt, sourceId, sourceUrl, freshnessState]
      properties:
        id: { type: string }
        campusId: { $ref: "#/components/schemas/CampusId" }
        title: { $ref: "#/components/schemas/BilingualText" }
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        freshnessState: { $ref: "#/components/schemas/FreshnessState" }
    EventPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Event" }
    GeoPoint:
      type: array
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    Place:
      type: object
      additionalProperties: false
      required: [id, campusId, name, location, sourceIds, verificationState]
      properties:
        id: { type: string }
        campusId: { $ref: "#/components/schemas/CampusId" }
        name: { $ref: "#/components/schemas/BilingualText" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        sourceIds:
          type: array
          minItems: 1
          items: { type: string }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    PlacePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Place" }
    RouteRequest:
      type: object
      additionalProperties: false
      required: [campusId, origin, destination, profile]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        origin: { $ref: "#/components/schemas/GeoPoint" }
        destination: { $ref: "#/components/schemas/GeoPoint" }
        profile:
          type: string
          enum: [WALK, WHEELCHAIR, BICYCLE, TRANSIT]
    RouteSegment:
      type: object
      additionalProperties: false
      required:
        [
          id,
          profile,
          geometry,
          distanceMeters,
          durationSeconds,
          instructions,
          verificationState,
          safetyCritical,
          sourceIds,
          validUntil,
        ]
      properties:
        id: { type: string }
        profile: { type: string, enum: [WALK, WHEELCHAIR, BICYCLE, TRANSIT] }
        geometry:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/GeoPoint" }
        distanceMeters: { type: number, minimum: 0 }
        durationSeconds: { type: number, minimum: 0 }
        instructions: { $ref: "#/components/schemas/BilingualText" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        safetyCritical: { type: boolean }
        sourceIds:
          type: array
          minItems: 1
          items: { type: string }
        validUntil: { type: [string, "null"], format: date-time }
    RouteResult:
      type: object
      additionalProperties: false
      required: [routeId, campusId, profile, segments, verificationState]
      properties:
        routeId: { type: string, format: uuid }
        campusId: { $ref: "#/components/schemas/CampusId" }
        profile: { type: string, enum: [WALK, WHEELCHAIR, BICYCLE, TRANSIT] }
        segments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RouteSegment" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    WorldTile:
      type: object
      additionalProperties: false
      required:
        [id, url, contentType, minZoom, maxZoom, bounds, sha256, byteLength, licenseStatus, verificationState]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        contentType: { type: string }
        minZoom: { type: integer, minimum: 0, maximum: 24 }
        maxZoom: { type: integer, minimum: 0, maximum: 24 }
        bounds:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        byteLength: { type: integer, minimum: 1 }
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    WorldPortal:
      type: object
      additionalProperties: false
      required: [id, label, fromCampusId, toCampusId, position, targetWorldVersion, verificationState]
      properties:
        id: { type: string }
        label: { $ref: "#/components/schemas/BilingualText" }
        fromCampusId: { $ref: "#/components/schemas/CampusId" }
        toCampusId: { $ref: "#/components/schemas/CampusId" }
        position:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
        targetWorldVersion: { type: string }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    CampusWorldManifest:
      type: object
      additionalProperties: false
      required:
        [campusId, worldVersion, revision, generatedAt, verificationState, etag, sourceIds, tiles, portals]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        worldVersion: { type: string }
        revision: { type: integer, minimum: 1 }
        generatedAt: { type: string, format: date-time }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        etag: { type: string }
        sourceIds:
          type: array
          minItems: 1
          items: { type: string }
        tiles:
          type: array
          items: { $ref: "#/components/schemas/WorldTile" }
        portals:
          type: array
          items: { $ref: "#/components/schemas/WorldPortal" }
    CommunityPost:
      type: object
      additionalProperties: false
      required: [id, campusId, authorAlias, body, moderationState, createdAt]
      properties:
        id: { type: string, format: uuid }
        campusId: { $ref: "#/components/schemas/CampusId" }
        authorAlias: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        moderationState: { type: string, enum: [PENDING, VISIBLE, HIDDEN, REMOVED] }
        createdAt: { type: string, format: date-time }
    CreateCommunityPost:
      type: object
      additionalProperties: false
      required: [campusId, body]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        body: { type: string, minLength: 1, maxLength: 5000 }
    CommunityPostPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CommunityPost" }
    AiQuery:
      type: object
      additionalProperties: false
      required: [campusId, locale, query]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        locale: { type: string, enum: [en, zh-CN] }
        query: { type: string, minLength: 1, maxLength: 4000 }
    Citation:
      type: object
      additionalProperties: false
      required: [sourceId, sourceUrl, title, verificationState, freshnessState]
      properties:
        sourceId: { type: string }
        sourceUrl: { type: string, format: uri }
        title: { type: string }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        freshnessState: { $ref: "#/components/schemas/FreshnessState" }
    AiAnswer:
      type: object
      additionalProperties: false
      required: [answer, locale, citations, safetyNotice]
      properties:
        answer: { type: string }
        locale: { type: string, enum: [en, zh-CN] }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        safetyNotice: { type: [string, "null"] }
    AcademicCourse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          academicInstitutionCode,
          campusIds,
          subject,
          catalogNumber,
          title,
          termCode,
          sourceId,
          verificationState,
        ]
      properties:
        id: { type: string, minLength: 1 }
        academicInstitutionCode: { $ref: "#/components/schemas/AcademicInstitutionCode" }
        campusIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CampusId" }
        subject: { type: string, minLength: 2, maxLength: 16 }
        catalogNumber: { type: string, minLength: 1, maxLength: 16 }
        title: { $ref: "#/components/schemas/BilingualText" }
        termCode: { type: string, minLength: 1, maxLength: 32 }
        sourceId: { type: string, minLength: 1 }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    AcademicCoursePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AcademicCourse" }
    Message:
      type: object
      additionalProperties: false
      required: [id, threadId, senderActorId, recipientActorId, body, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        senderActorId: { type: string, minLength: 1, maxLength: 256 }
        recipientActorId: { type: string, minLength: 1, maxLength: 256 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    CreateMessage:
      type: object
      additionalProperties: false
      required: [recipientActorId, body]
      properties:
        recipientActorId: { type: string, minLength: 1, maxLength: 256 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    MessagePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Message" }
    LiveEventJoinRequest:
      type: object
      additionalProperties: false
      required: [campusId, deviceBoundNonce, scopes]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        deviceBoundNonce: { type: string, minLength: 8, maxLength: 256 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [world:join, presence:publish, media:publish] }
    WorldJoinTicket:
      type: object
      additionalProperties: false
      required:
        [ticketId, campusId, participantId, roomName, token, deviceBoundNonce, scopes, issuedAt, expiresAt]
      properties:
        ticketId: { type: string, format: uuid }
        campusId: { $ref: "#/components/schemas/CampusId" }
        participantId: { type: string, minLength: 1, maxLength: 128 }
        roomName: { type: string, minLength: 1, maxLength: 128 }
        token: { type: string, minLength: 16, maxLength: 4096, writeOnly: true }
        deviceBoundNonce: { type: string, minLength: 8, maxLength: 256 }
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [world:join, presence:publish, media:publish] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ModerationTarget:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [community_post, community_comment, live_session, user_profile] }
        id: { type: string, minLength: 1, maxLength: 256 }
    ModerationResolution:
      type: object
      additionalProperties: false
      required: [action, rationale, resolvedBy, resolvedAt]
      properties:
        action: { type: string, enum: [NO_ACTION, CONTENT_REMOVED, USER_WARNED, USER_SUSPENDED, ESCALATED] }
        rationale: { type: string, minLength: 1, maxLength: 2000 }
        resolvedBy: { type: string, minLength: 1, maxLength: 256 }
        resolvedAt: { type: string, format: date-time }
    ModerationCase:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          state,
          priority,
          target,
          reasonCodes,
          reporterActorId,
          assignedModeratorId,
          resolution,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [COMMUNITY_REPORT, LIVE_SAFETY_REPORT, AUTOMATED_SIGNAL] }
        state: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        target: { $ref: "#/components/schemas/ModerationTarget" }
        reasonCodes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 64 }
        reporterActorId: { type: [string, "null"], maxLength: 256 }
        assignedModeratorId: { type: [string, "null"], maxLength: 256 }
        resolution:
          oneOf:
            - $ref: "#/components/schemas/ModerationResolution"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModerationCasePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ModerationCase" }
    AdminSourcePolicyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        cachePolicy:
          type: string
          enum: [CACHE_ALLOWED, METADATA_ONLY, NO_CONTENT_CACHE, NO_ACCESS]
        attribution: { type: string, minLength: 1 }
      allOf:
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: PROHIBITED }
          then:
            required: [cachePolicy]
            properties:
              cachePolicy: { const: NO_ACCESS }
        - if:
            required: [cachePolicy]
            properties:
              cachePolicy:
                not: { const: NO_ACCESS }
          then:
            required: [licenseStatus]
            properties:
              licenseStatus:
                not: { const: PROHIBITED }
    PageEnvelope:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: true }
        nextCursor:
          description: Opaque cursor for the next page, null when exhausted.
          type: [string, "null"]
    Problem:
      type: object
      description: RFC 9457 problem details. Unknown extension members may be added.
      required: [type, title, status, detail, instance, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        traceId: { type: string }
