      properties:
        id: { type: string, format: uuid }
        campusId: { $ref: "#/components/schemas/CampusId" }
        authorAlias: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        moderationState: { type: string, enum: [PENDING, VISIBLE, HIDDEN, REMOVED] }
        createdAt: { type: string, format: date-time }
    CreateCommunityPost:
      type: object
      additionalProperties: false
      required: [campusId, body]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        body: { type: string, minLength: 1, maxLength: 5000 }
    CommunityPostPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CommunityPost" }
    AiLocale:
      type: string
      enum: [en, zh-CN]
    AiQueryState:
      type: string
      enum: [answered, stale, conflict, no-results]
    AiCitationCategory:
      type: string
      enum: [library, student-services, safety, transportation, dining]
    AiBilingualText:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      properties:
        en:
          type: string
          minLength: 1
          maxLength: 2000
          x-uga-semantic-validator: ai-evidence-text-v1
        zh-CN:
          type: string
          minLength: 1
          maxLength: 2000
          x-uga-semantic-validator: ai-evidence-text-v1
    AiQueryRequest:
      type: object
      additionalProperties: false
      required: [campusId, locale, query]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        locale: { $ref: "#/components/schemas/AiLocale" }
        query:
          type: string
          x-uga-trim: true
          x-uga-semantic-validator: ai-query-text-v1
          minLength: 2
          maxLength: 500
          pattern: "^\\S(?:[\\s\\S]{0,498}\\S)?$"
          description: NFC plain text after leading and trailing whitespace have been removed; HTML and Unicode control/format/surrogate characters are rejected.
    AiAnswerParagraph:
      type: object
      additionalProperties: false
      required: [id, text, citationIds]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        text:
          type: string
          minLength: 1
          maxLength: 4000
          x-uga-semantic-validator: ai-evidence-text-v1
        citationIds:
          type: array
          minItems: 1
          maxItems: 64
          description: Unique IDs that must resolve to citations in the same response.
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
    AiSummaryLicense:
      type: object
      additionalProperties: false
      required: [status, spdxId, evidenceUrl]
      properties:
        status: { type: string, const: OPEN_REUSE }
        spdxId: { type: string, const: Apache-2.0 }
        evidenceUrl:
          type: string
          const: https://www.apache.org/licenses/LICENSE-2.0
    AiSummarySource:
      type: object
      additionalProperties: false
      description: Provenance for text authored and licensed by the UMN Gopher Assistant project.
      required: [kind, sourceId, sourceUrl, corpusSha256, license]
      properties:
        kind: { type: string, const: project-authored-summary }
        sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        sourceUrl:
          type: string
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]://[Gg][Ii][Tt][Hh][Uu][Bb]\\.[Cc][Oo][Mm](?::443)?/appleweiping/umn-gopher-assistant/blob/main/apps/ai-knowledge/ai_knowledge/data/corpus\\.json$"
        corpusSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        license: { $ref: "#/components/schemas/AiSummaryLicense" }
    AiVerificationLink:
      type: object
      additionalProperties: false
      description: An official UMN deep link supplied only for user verification; its content was not retrieved.
      required: [kind, sourceId, sourceUrl, licenseStatus, sourceUse, contentRetrieved]
      properties:
        kind: { type: string, const: official-verification-link }
        sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        sourceUrl:
          type: string
          format: uri
          pattern: "^[Hh][Tt][Tt][Pp][Ss]://(?:[A-Za-z0-9-]+\\.)*[Uu][Mm][Nn]\\.[Ee][Dd][Uu](?::443)?(?:/[^@?#]*)?$"
        licenseStatus: { type: string, const: DEEPLINK_ONLY }
        sourceUse: { type: string, const: verification-link-only }
        contentRetrieved: { type: boolean, const: false }
    AiCitation:
      type: object
      additionalProperties: false
      description: A project-authored summary and a separately identified official link where the user can verify it. The two nested source IDs must be different.
      required:
        [
          id,
          documentId,
          campusId,
          category,
          title,
          excerpt,
          contentSha256,
          updatedAt,
          summaryFreshnessState,
          summaryVerificationState,
          summarySource,
          verificationLink,
        ]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$" }
        documentId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        campusId: { $ref: "#/components/schemas/CampusId" }
        category: { $ref: "#/components/schemas/AiCitationCategory" }
        title: { $ref: "#/components/schemas/AiBilingualText" }
        excerpt:
          type: string
          minLength: 1
          maxLength: 4000
          x-uga-semantic-validator: ai-evidence-text-v1
        contentSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        updatedAt: { type: string, format: date-time }
        summaryFreshnessState:
          type: string
          enum: [FRESH, STALE, EXPIRED]
        summaryVerificationState:
          type: string
          const: schematic
          description: Link-only summaries cannot claim a reviewed or verified state without a review-evidence artifact.
        summarySource: { $ref: "#/components/schemas/AiSummarySource" }
        verificationLink: { $ref: "#/components/schemas/AiVerificationLink" }
    AiRetrieval:
      type: object
      additionalProperties: false
      required: [mode, documentsConsidered]
      properties:
        mode: { type: string, const: no-key-hybrid }
        documentsConsidered: { type: integer, minimum: 0, maximum: 1000000 }
    AiQueryResponse:
      type: object
      x-uga-semantic-validator: ai-query-response-v2
      additionalProperties: false
      description: |
        `answered`, `stale`, and `conflict` require evidence-backed paragraphs. Paragraph IDs, citation IDs,
        and each paragraph's citation IDs are unique; every reference resolves within the response; and every
        citation campus matches `campusId`. Every citation is referenced, its authored-summary state is
        `schematic`, and its summary freshness is not UNKNOWN. `no-results` has no paragraphs or citations,
        `answered` cites only FRESH summaries,
        `stale` cites only STALE or EXPIRED summaries, and `conflict` has at least two distinct authored document
        IDs, official verification-link source IDs, and content hashes. Every citation in one response is bound
        to the same authored-summary corpus SHA-256 snapshot.
      required: [state, queryId, campusId, locale, paragraphs, citations, retrieval]
      properties:
        state: { $ref: "#/components/schemas/AiQueryState" }
        queryId:
          type: string
          pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
        campusId: { $ref: "#/components/schemas/CampusId" }
        locale: { $ref: "#/components/schemas/AiLocale" }
        paragraphs:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/AiAnswerParagraph" }
        citations:
          type: array
          maxItems: 128
          items: { $ref: "#/components/schemas/AiCitation" }
        retrieval: { $ref: "#/components/schemas/AiRetrieval" }
    AcademicSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          campusId,
          institutionCode,
          academicCareerCode,
          termCode,
          sessionCode,
          name,
          beginDate,
          endDate,
          enrollmentOpenDate,
          sourceId,
          sourceObservationId,
          observedAt,
        ]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$" }
        campusId: { $ref: "#/components/schemas/CampusId" }
        institutionCode: { $ref: "#/components/schemas/AcademicInstitutionCode" }
        academicCareerCode: { type: string, pattern: "^[A-Z0-9]{2,12}$" }
        termCode: { type: string, pattern: "^[0-9]{4}$" }
        sessionCode: { type: string, pattern: "^[A-Z0-9]{1,12}$" }
        name: { type: string, minLength: 1, maxLength: 256 }
        beginDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        endDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        enrollmentOpenDate:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        sourceObservationId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        observedAt: { type: string, format: date-time }
      allOf:
        - if:
            required: [campusId]
            properties: { campusId: { enum: [tc, rochester] } }
          then:
            required: [institutionCode]
            properties: { institutionCode: { const: UMNTC } }
        - if:
            required: [campusId]
            properties: { campusId: { const: duluth } }
          then:
            required: [institutionCode]
            properties: { institutionCode: { const: UMNDL } }
        - if:
            required: [campusId]
            properties: { campusId: { const: crookston } }
          then:
            required: [institutionCode]
            properties: { institutionCode: { const: UMNCR } }
        - if:
            required: [campusId]
            properties: { campusId: { const: morris } }
          then:
            required: [institutionCode]
            properties: { institutionCode: { const: UMNMO } }
    AcademicSessionPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, range, retrievalCoverage, sourceObservations]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AcademicSession" }
        nextCursor:
          type: [string, "null"]
          minLength: 45
          maxLength: 1994
          pattern: "^[A-Za-z0-9_-]{1,1950}\\.[A-Za-z0-9_-]{43}$"
        range: { $ref: "#/components/schemas/CatalogRange" }
        retrievalCoverage: { $ref: "#/components/schemas/RetrievalCoverage" }
        sourceObservations:
          type: array
          minItems: 1
          maxItems: 1
          items: { $ref: "#/components/schemas/SourceObservation" }
    AcademicCourse:
      type: object
      additionalProperties: false
      required:
        [
          id,
          academicInstitutionCode,
          campusIds,
          subject,
          catalogNumber,
          title,
          termCode,
          sourceId,
          verificationState,
        ]
      properties:
        id: { type: string, minLength: 1 }
        academicInstitutionCode: { $ref: "#/components/schemas/AcademicInstitutionCode" }
        campusIds:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/CampusId" }
        subject: { type: string, minLength: 2, maxLength: 16 }
        catalogNumber: { type: string, minLength: 1, maxLength: 16 }
        title: { $ref: "#/components/schemas/BilingualText" }
        termCode: { type: string, minLength: 1, maxLength: 32 }
        sourceId: { type: string, minLength: 1 }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    AcademicCoursePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/AcademicCourse" }
    Message:
      type: object
      additionalProperties: false
      required: [id, threadId, senderActorId, recipientActorId, body, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        threadId: { type: string, format: uuid }
        senderActorId: { type: string, minLength: 1, maxLength: 256 }
        recipientActorId: { type: string, minLength: 1, maxLength: 256 }
        body: { type: string, minLength: 1, maxLength: 5000 }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    CreateMessage:
      type: object
      additionalProperties: false
      required: [recipientActorId, body]
      properties:
        recipientActorId: { type: string, minLength: 1, maxLength: 256 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    MessagePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Message" }
    LiveEventJoinRequest:
      type: object
      additionalProperties: false
      required: [campusId, deviceBoundNonce, scopes]
      properties:
        campusId: { $ref: "#/components/schemas/CampusId" }
        deviceBoundNonce: { type: string, minLength: 8, maxLength: 256 }
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [world:join, presence:publish, media:publish] }
    WorldJoinTicket:
      type: object
      additionalProperties: false
      required:
        [ticketId, campusId, participantId, roomName, token, deviceBoundNonce, scopes, issuedAt, expiresAt]
      properties:
        ticketId: { type: string, format: uuid }
        campusId: { $ref: "#/components/schemas/CampusId" }
        participantId: { type: string, minLength: 1, maxLength: 128 }
        roomName: { type: string, minLength: 1, maxLength: 128 }
        token: { type: string, minLength: 16, maxLength: 4096, writeOnly: true }
        deviceBoundNonce: { type: string, minLength: 8, maxLength: 256 }
        scopes:
          type: array
          minItems: 1
          items: { type: string, enum: [world:join, presence:publish, media:publish] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    ModerationTarget:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [community_post, community_comment, live_session, user_profile] }
        id: { type: string, minLength: 1, maxLength: 256 }
    ModerationResolution:
      type: object
      additionalProperties: false
      required: [action, rationale, resolvedBy, resolvedAt]
      properties:
        action: { type: string, enum: [NO_ACTION, CONTENT_REMOVED, USER_WARNED, USER_SUSPENDED, ESCALATED] }
        rationale: { type: string, minLength: 1, maxLength: 2000 }
        resolvedBy: { type: string, minLength: 1, maxLength: 256 }
        resolvedAt: { type: string, format: date-time }
    ModerationCase:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          state,
          priority,
          target,
          reasonCodes,
          reporterActorId,
          assignedModeratorId,
          resolution,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [COMMUNITY_REPORT, LIVE_SAFETY_REPORT, AUTOMATED_SIGNAL] }
        state: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, DISMISSED] }
        priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
        target: { $ref: "#/components/schemas/ModerationTarget" }
        reasonCodes:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 64 }
        reporterActorId: { type: [string, "null"], maxLength: 256 }
        assignedModeratorId: { type: [string, "null"], maxLength: 256 }
        resolution:
          oneOf:
            - $ref: "#/components/schemas/ModerationResolution"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModerationCasePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/ModerationCase" }
    AdminSourcePolicyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        cachePolicy:
          type: string
          enum: [CACHE_ALLOWED, METADATA_ONLY, NO_CONTENT_CACHE, NO_ACCESS]
        attribution: { type: string, minLength: 1 }
      allOf:
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: PROHIBITED }
          then:
            required: [cachePolicy]
            properties:
              cachePolicy: { const: NO_ACCESS }
        - if:
            required: [cachePolicy]
            properties:
              cachePolicy:
                not: { const: NO_ACCESS }
          then:
            required: [licenseStatus]
            properties:
              licenseStatus:
                not: { const: PROHIBITED }
    PageEnvelope:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: true }
        nextCursor:
          description: Opaque cursor for the next page, null when exhausted.
          type: [string, "null"]
    Problem:
      type: object
      description: RFC 9457 problem details. Unknown extension members may be added.
      required: [type, title, status, detail, instance, traceId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        traceId: { type: string }
    ConnectorUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [sourceId, failureCode, officialUrl]
          properties:
            title: { type: string, const: Service Unavailable }
            status: { type: integer, const: 503 }
            sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
            failureCode: { type: string, pattern: "^[A-Z][A-Z0-9_]{2,63}$" }
            officialUrl: { type: string, format: uri, pattern: "^https://" }
    AiRateLimitProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [failureCode]
          properties:
            title: { type: string, const: Too Many Requests }
            status: { type: integer, const: 429 }
            failureCode: { type: string, const: AI_RATE_LIMITED }
    AiUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [failureCode]
          properties:
            title: { type: string, const: Service Unavailable }
            status: { type: integer, const: 503 }
            failureCode: { type: string, pattern: "^AI_[A-Z0-9_]{2,60}$" }
