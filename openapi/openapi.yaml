components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: |
        Local Keycloak in development; the production issuer is deployment-specific. Browser and
        remote-client authorization uses authorization code with PKCE S256. The local CLI uses the
        Keycloak RFC 8628 device authorization endpoint. RFC 8707 resource indicators are not supported
        by Keycloak 26.7.0, so this realm is only partially compatible with the MCP
        2025-06-18 and 2025-11-25 authorization specifications. Its experimental CIMD support is
        not enabled here and would not replace RFC 8707.

        Every operation with this security scheme requires RFC 9449 sender-constrained credentials:
        the access token is sent as `Authorization: DPoP <token>` and a fresh ES256 proof JWT is sent
        in the `DPoP` request header. Bearer fallback is prohibited. Clients must validate
        `token_type=DPoP` and `cnf.jkt`, consume `DPoP-Nonce` on any response, and retry a
        `use_dpop_nonce` challenge at most once with a new `jti`.
      x-dpop-required: true
      x-dpop-proof-header: DPoP
      x-dpop-nonce-header: DPoP-Nonce
      x-dpop-algorithms: [ES256]
      x-authorization-scheme: DPoP
      x-device-authorization-url: http://localhost:8080/realms/gopher-assistant-dev/protocol/openid-connect/auth/device
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/realms/gopher-assistant-dev/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/realms/gopher-assistant-dev/protocol/openid-connect/token
          x-pkce-required: true
          scopes:
            openid: OpenID Connect
            campus:read: Read campus-scoped public and approved data
            campus:write: Modify reviewed campus-scoped metadata
            personal:read: Read the authenticated user's private data
            personal:write: Modify the authenticated user's private data
            community:read: Read authenticated community resources
            community:write: Create or moderate community resources
            messages:read: Read private messages for the authenticated user
            messages:write: Send private messages as the authenticated user
            world:read: Read authenticated world-session resources
            world:write: Join or publish to authorized world sessions
            admin:read: Read administrative review resources
            admin:write: Modify administrative policy resources
  parameters:
    CampusPath:
      name: campusId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CampusId"
    CampusQuery:
      name: campusId
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/CampusId"
    RequiredCampusQuery:
      name: campusId
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/CampusId"
    FromDate:
      name: from
      in: query
      required: false
      description: Inclusive local calendar date; must be supplied together with `to`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    ToDate:
      name: to
      in: query
      required: false
      description: Inclusive local calendar date; must be supplied together with `from`.
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    AcademicInstitutionQuery:
      name: academicInstitutionCode
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AcademicInstitutionCode"
    EventIdPath:
      name: eventId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    SourceIdPath:
      name: sourceId
      in: path
      required: true
      schema: { type: string, minLength: 3, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: Integrity-protected opaque cursor returned as nextCursor; clients must not parse or modify it.
      schema: { $ref: "#/components/schemas/CatalogCursor" }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Conditional request validator from a previous ETag response.
      schema: { type: string, maxLength: 256 }
    VaultIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: One strong ETag returned by a previous personal-vault response.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^"[\x21\x23-\x7e]+"$'
    VaultCreateIfNoneMatch:
      name: If-None-Match
      in: header
      required: true
      description: Vault creation is allowed only when no vault exists.
      schema: { type: string, const: "*" }
    VaultIfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Exactly one strong ETag returned by the current vault snapshot. Weak validators, wildcard
        validators, and comma-separated validator lists are rejected.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^"[\x21\x23-\x7e]+"$'
    VaultReadProof:
      name: X-Vault-Read-Proof
      in: header
      required: true
      description: |
        Canonical unpadded base64url JSON containing a short-lived single-use
        `VaultReadProofV2`. This proves possession of an authorization private key; it is
        independent from the OAuth DPoP credential and is consumed before a possible 304 response.
      schema:
        type: string
        minLength: 64
        maxLength: 5462
        pattern: "^[A-Za-z0-9_-]+$"
    PairingIdPath:
      name: pairingId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/CanonicalUuid"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique opaque key retained for 24 hours; reuse with a different body returns 409.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[\x21-\x7e]+$' }
  headers:
    ETag:
      description: Entity tag for conditional requests.
      schema: { type: string }
    StrongETag:
      description: One strong entity tag for optimistic personal-vault concurrency control.
      schema:
        type: string
        minLength: 3
        maxLength: 128
        pattern: '^"[\x21\x23-\x7e]+"$'
    RequestId:
      description: Correlation ID suitable for support, not an authentication credential.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
    DPoPNonce:
      description: |
        RFC 9449 server nonce. A client stores this value per protected-resource origin and
        DPoP public-key thumbprint, then includes it in the next fresh proof.
      schema:
        type: string
        minLength: 8
        maxLength: 512
        pattern: "^[A-Za-z0-9._~-]+$"
    WwwAuthenticateDPoP:
      description: |
        RFC 9449 DPoP authentication challenge. `error="use_dpop_nonce"` is accompanied by
        `DPoP-Nonce`; other values include `invalid_token`, `invalid_dpop_proof`, and
        `insufficient_scope`.
      schema:
        type: string
        minLength: 4
        maxLength: 2048
    NoStore:
      description: This representation must not be stored by clients or intermediaries.
      schema: { type: string, const: no-store }
    RateLimitRemaining:
      description: Remaining requests for the anonymous client in the current fixed window.
      schema: { type: integer, minimum: 0 }
    RateLimitLimit:
      description: Maximum anonymous-client requests allowed in the current fixed window.
      schema: { type: integer, minimum: 1 }
    RateLimitReset:
      description: Whole seconds until the anonymous client's fixed window resets; this is not an epoch timestamp.
      schema: { type: integer, minimum: 1 }
    IdempotencyReplayed:
      description: True when the response is a replay of a prior request with the same key and body.
      schema: { type: boolean }
  responses:
    NotModified:
      description: Representation has not changed; response has no body.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    VaultNotModified:
      description: |
        The account-bound encrypted representation has not changed. The response has no body;
        a supplied read proof has still been consumed and must not be replayed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/StrongETag"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    VaultSnapshotMutationSucceeded:
      description: Authenticated encrypted snapshot committed atomically
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/StrongETag"
        Idempotency-Replayed:
          $ref: "#/components/headers/IdempotencyReplayed"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VaultSyncSnapshotV2"
    LiveCatalogNotModified:
      description: |
        The live source was revalidated and the normalized representation has not changed;
        the response has no body and remains non-cacheable.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/ETag"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: |
        DPoP authentication is required or invalid. A `use_dpop_nonce` response includes a
        fresh nonce and can be retried once with a new proof JWT and `jti`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        DPoP-Nonce:
          $ref: "#/components/headers/DPoPNonce"
        WWW-Authenticate:
          $ref: "#/components/headers/WwwAuthenticateDPoP"
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Authenticated principal lacks the required scope or resource authorization
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource was not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    CursorExpired:
      description: Cursor snapshot is no longer the current normalized source snapshot
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State or idempotency-key conflict
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: The supplied strong ETag no longer identifies the current vault state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionRequired:
      description: A required conditional, possession-proof, or idempotency header is missing
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: Semantically invalid or policy-disallowed request
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: Request body exceeds the route-specific byte limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: Request body does not use a supported media type
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    AiTooManyRequests:
      description: Anonymous campus knowledge query budget is exhausted
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        Retry-After:
          schema: { type: integer, minimum: 1 }
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/AiRateLimitProblem" }
    AiUnavailable:
      description: Campus knowledge retrieval or its distributed abuse control is temporarily unavailable
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          schema: { type: integer, minimum: 1 }
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/AiUnavailableProblem" }
    ConnectorUnavailable:
      description: Required connector is disabled, unapproved, or temporarily unavailable
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          schema: { type: integer, minimum: 1 }
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ConnectorUnavailableProblem" }
    ServiceUnavailable:
      description: A required private-sync dependency is temporarily unavailable
      headers:
        Retry-After:
          schema: { type: integer, minimum: 1 }
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalServerError:
      description: Unexpected server failure
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    CanonicalUuid:
      type: string
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    NullableCanonicalUuid:
      type: [string, "null"]
      minLength: 36
      maxLength: 36
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    CanonicalUtcDateTime:
      type: string
      format: date-time
      minLength: 24
      maxLength: 24
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    NullableCanonicalUtcDateTime:
      type: [string, "null"]
      format: date-time
      minLength: 24
      maxLength: 24
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\\.[0-9]{3}Z$"
    PositiveSafeInteger:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    NullablePositiveSafeInteger:
      type: [integer, "null"]
      minimum: 1
      maximum: 9007199254740991
    OwnerBindingV2:
      type: string
      description: Opaque HMAC-derived account binding; never an OIDC subject or internal account ID.
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    Base64UrlHash32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    NullableBase64UrlHash32:
      type: [string, "null"]
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    Base64UrlPublicKey32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    Base64UrlSignature64:
      type: string
      minLength: 86
      maxLength: 86
      pattern: "^[A-Za-z0-9_-]{85}[AQgw]$"
    Base64UrlNonce24:
      type: string
      minLength: 32
      maxLength: 32
      pattern: "^[A-Za-z0-9_-]{32}$"
    Base64UrlSalt16:
      type: string
      minLength: 22
      maxLength: 22
      pattern: "^[A-Za-z0-9_-]{21}[AQgw]$"
    Base64UrlDeviceWrappedKey80:
      type: string
      minLength: 107
      maxLength: 107
      pattern: "^[A-Za-z0-9_-]{106}[AEIMQUYcgkosw048]$"
    Base64UrlRecoveryWrappedKey48:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[A-Za-z0-9_-]{64}$"
    Base64UrlAad:
      type: string
      description: Canonical authenticated-data bytes encoded as unpadded base64url.
      minLength: 2
      maxLength: 5462
      pattern: "^[A-Za-z0-9_-]+$"
    Base64UrlVaultCiphertext:
      type: string
      description: |
        XChaCha20-Poly1305 ciphertext over complete 4096-byte sodium padding blocks. Decoded
        length is at most 8,388,624 bytes; the whole HTTP JSON body is capped at 16 MiB.
      minLength: 5483
      maxLength: 11184832
      pattern: "^[A-Za-z0-9_-]+$"
    DeviceEncryptionPublicKeyV2:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, publicKey, fingerprint]
      properties:
        keyId: { $ref: "#/components/schemas/CanonicalUuid" }
        algorithm: { type: string, const: X25519 }
        publicKey: { $ref: "#/components/schemas/Base64UrlPublicKey32" }
        fingerprint: { $ref: "#/components/schemas/Base64UrlHash32" }
    DeviceAuthorizationPublicKeyV2:
      type: object
      additionalProperties: false
      required: [keyId, algorithm, publicKey, fingerprint]
      properties:
        keyId: { $ref: "#/components/schemas/CanonicalUuid" }
        algorithm: { type: string, const: ED25519 }
        publicKey: { $ref: "#/components/schemas/Base64UrlPublicKey32" }
        fingerprint: { $ref: "#/components/schemas/Base64UrlHash32" }
    DeviceDescriptorV2:
      type: object
      additionalProperties: false
      description: |
        The encryption and authorization key IDs must differ. A non-null revocation timestamp
        cannot precede creation; current manifests must retain at least one non-revoked device.
      required: [formatVersion, ownerBinding, deviceId, encryptionKey, authorizationKey, createdAt, revokedAt]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        deviceId: { $ref: "#/components/schemas/CanonicalUuid" }
        encryptionKey: { $ref: "#/components/schemas/DeviceEncryptionPublicKeyV2" }
        authorizationKey: { $ref: "#/components/schemas/DeviceAuthorizationPublicKeyV2" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        revokedAt: { $ref: "#/components/schemas/NullableCanonicalUtcDateTime" }
    RecoveryAuthorizationPublicKeyV2:
      type: object
      additionalProperties: false
      required:
        [formatVersion, ownerBinding, vaultId, keyId, algorithm, publicKey, fingerprint, createdAt, revokedAt]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        keyId: { $ref: "#/components/schemas/CanonicalUuid" }
        algorithm: { type: string, const: ED25519 }
        publicKey: { $ref: "#/components/schemas/Base64UrlPublicKey32" }
        fingerprint: { $ref: "#/components/schemas/Base64UrlHash32" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        revokedAt: { $ref: "#/components/schemas/NullableCanonicalUtcDateTime" }
    AuthorizationManifestV2:
      type: object
      additionalProperties: false
      description: |
        Device IDs and all key IDs are unique. Every device and the current recovery key are bound
        to this owner and vault. At least one device remains active and the current recovery key is
        not revoked. Lifecycle timestamps and revisions are monotonic.
      required:
        [
          formatVersion,
          ownerBinding,
          vaultId,
          epoch,
          revision,
          devices,
          recoveryAuthorization,
          createdAt,
          updatedAt,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        epoch: { $ref: "#/components/schemas/PositiveSafeInteger" }
        revision: { $ref: "#/components/schemas/PositiveSafeInteger" }
        devices:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/DeviceDescriptorV2" }
        recoveryAuthorization:
          $ref: "#/components/schemas/RecoveryAuthorizationPublicKeyV2"
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        updatedAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    VaultPayloadPaddingV1:
      type: object
      additionalProperties: false
      required: [algorithm, blockSize]
      properties:
        algorithm: { type: string, const: SODIUM_PAD }
        blockSize: { type: integer, const: 4096 }
    EncryptedVaultPayloadEnvelopeV2:
      type: object
      additionalProperties: false
      description: |
        Revision one has a null base revision; later revisions advance exactly one. `aad` is the
        canonical account-bound V2 metadata tuple and ciphertext contains only padded client data.
      required:
        [
          formatVersion,
          ownerBinding,
          vaultId,
          vaultKeyId,
          revision,
          baseRevision,
          cipherSuite,
          contentType,
          contentSchemaVersion,
          padding,
          nonce,
          ciphertext,
          aad,
          createdAt,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        vaultKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        revision: { $ref: "#/components/schemas/PositiveSafeInteger" }
        baseRevision: { $ref: "#/components/schemas/NullablePositiveSafeInteger" }
        cipherSuite: { type: string, const: XCHACHA20_POLY1305 }
        contentType:
          type: string
          const: application/vnd.umn-gopher-assistant.personal-vault+json
        contentSchemaVersion: { type: integer, const: 1 }
        padding: { $ref: "#/components/schemas/VaultPayloadPaddingV1" }
        nonce: { $ref: "#/components/schemas/Base64UrlNonce24" }
        ciphertext: { $ref: "#/components/schemas/Base64UrlVaultCiphertext" }
        aad: { $ref: "#/components/schemas/Base64UrlAad" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    DevicePublicKeyV1:
      type: object
      additionalProperties: false
      required:
        [
          formatVersion,
          deviceId,
          deviceKeyId,
          keyAlgorithm,
          publicKey,
          publicKeyFingerprint,
          createdAt,
          revokedAt,
        ]
      properties:
        formatVersion: { type: integer, const: 1 }
        deviceId: { $ref: "#/components/schemas/CanonicalUuid" }
        deviceKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        keyAlgorithm: { type: string, const: X25519 }
        publicKey: { $ref: "#/components/schemas/Base64UrlPublicKey32" }
        publicKeyFingerprint: { $ref: "#/components/schemas/Base64UrlHash32" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        revokedAt: { $ref: "#/components/schemas/NullableCanonicalUtcDateTime" }
    DeviceKeyEnvelopeV1:
      type: object
      additionalProperties: false
      required:
        [
          formatVersion,
          vaultId,
          vaultKeyId,
          recipientDeviceId,
          recipientKeyId,
          recipientPublicKeyFingerprint,
          cipherSuite,
          ephemeralPublicKey,
          nonce,
          wrappedKey,
          createdAt,
        ]
      properties:
        formatVersion: { type: integer, const: 1 }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        vaultKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        recipientDeviceId: { $ref: "#/components/schemas/CanonicalUuid" }
        recipientKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        recipientPublicKeyFingerprint: { $ref: "#/components/schemas/Base64UrlHash32" }
        cipherSuite: { type: string, const: X25519_XCHACHA20_POLY1305 }
        ephemeralPublicKey: { $ref: "#/components/schemas/Base64UrlPublicKey32" }
        nonce: { $ref: "#/components/schemas/Base64UrlNonce24" }
        wrappedKey: { $ref: "#/components/schemas/Base64UrlDeviceWrappedKey80" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    Argon2idParametersV1:
      type: object
      additionalProperties: false
      required: [algorithm, salt, opsLimit, memLimitBytes, outputBytes]
      properties:
        algorithm: { type: string, const: ARGON2ID13 }
        salt: { $ref: "#/components/schemas/Base64UrlSalt16" }
        opsLimit: { type: integer, minimum: 2, maximum: 4 }
        memLimitBytes: { type: integer, minimum: 67108864, maximum: 268435456 }
        outputBytes: { type: integer, const: 32 }
    RecoveryKeyEnvelopeV1:
      type: object
      additionalProperties: false
      description: The `aad` value must exactly encode the canonical V1 recovery metadata.
      required: [formatVersion, vaultId, vaultKeyId, cipherSuite, kdf, nonce, wrappedKey, aad, createdAt]
      properties:
        formatVersion: { type: integer, const: 1 }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        vaultKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        cipherSuite: { type: string, const: XCHACHA20_POLY1305 }
        kdf: { $ref: "#/components/schemas/Argon2idParametersV1" }
        nonce: { $ref: "#/components/schemas/Base64UrlNonce24" }
        wrappedKey: { $ref: "#/components/schemas/Base64UrlRecoveryWrappedKey48" }
        aad: { $ref: "#/components/schemas/Base64UrlAad" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    VaultKeyringV1:
      type: object
      additionalProperties: false
      description: |
        Device recipients and key IDs are unique and match optional public-key descriptors one to
        one. Every envelope is for this vault and root key, and lifecycle timestamps are monotonic.
      required:
        [
          formatVersion,
          vaultId,
          vaultKeyId,
          revision,
          deviceEnvelopes,
          recoveryEnvelope,
          createdAt,
          updatedAt,
        ]
      properties:
        formatVersion: { type: integer, const: 1 }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        vaultKeyId: { $ref: "#/components/schemas/CanonicalUuid" }
        revision: { $ref: "#/components/schemas/PositiveSafeInteger" }
        devicePublicKeys:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/DevicePublicKeyV1" }
        deviceEnvelopes:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: "#/components/schemas/DeviceKeyEnvelopeV1" }
        recoveryEnvelope: { $ref: "#/components/schemas/RecoveryKeyEnvelopeV1" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        updatedAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    VaultCommitAuthorV2:
      type: object
      additionalProperties: false
      description: The `deviceId` value is non-null only for `DEVICE` authors.
      required: [kind, keyId, deviceId]
      properties:
        kind: { type: string, enum: [DEVICE, RECOVERY] }
        keyId: { $ref: "#/components/schemas/CanonicalUuid" }
        deviceId: { $ref: "#/components/schemas/NullableCanonicalUuid" }
    VaultCommitV2:
      type: object
      additionalProperties: false
      description: |
        Only the epoch-one sequence-one genesis commit has a null parent. Hashes bind the payload,
        keyring, authorization manifest, and preceding commit. The public-key `signature` is checked
        by the service. `stateMac` is bound into the commit hash and signed mutation command, but only
        a client holding the root vault key can verify that MAC when reading stored state.
      required:
        [
          formatVersion,
          ownerBinding,
          vaultId,
          epoch,
          sequence,
          parentCommitHash,
          payloadHash,
          keyringHash,
          authorizationManifestHash,
          operationId,
          author,
          createdAt,
          stateMac,
          signature,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        epoch: { $ref: "#/components/schemas/PositiveSafeInteger" }
        sequence: { $ref: "#/components/schemas/PositiveSafeInteger" }
        parentCommitHash: { $ref: "#/components/schemas/NullableBase64UrlHash32" }
        payloadHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        keyringHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        authorizationManifestHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        author: { $ref: "#/components/schemas/VaultCommitAuthorV2" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        stateMac: { $ref: "#/components/schemas/Base64UrlHash32" }
        signature: { $ref: "#/components/schemas/Base64UrlSignature64" }
    VaultSyncSnapshotV2:
      type: object
      additionalProperties: false
      description: |
        All components must use this owner and vault. The root-key identity, authorization epoch,
        component hashes, current author, and Ed25519 signature are validated as one atomic snapshot
        before storage or return. On mutation, the short-lived signed command also binds the exact
        commit hash (including `stateMac`). A reader must still verify `stateMac` with its root key;
        the service never possesses that key and cannot independently validate the MAC.
      required:
        [formatVersion, ownerBinding, vaultId, commitHash, commit, payload, keyring, authorizationManifest]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        commitHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        commit: { $ref: "#/components/schemas/VaultCommitV2" }
        payload: { $ref: "#/components/schemas/EncryptedVaultPayloadEnvelopeV2" }
        keyring: { $ref: "#/components/schemas/VaultKeyringV1" }
        authorizationManifest: { $ref: "#/components/schemas/AuthorizationManifestV2" }
    VaultCommandProofV2:
      type: object
      additionalProperties: false
      description: |
        Short-lived Ed25519 proof binding command type, owner, vault, operation ID, expected parent,
        next commit, and signer. Lifetime is positive and at most ten minutes.
      required:
        [
          formatVersion,
          commandType,
          ownerBinding,
          vaultId,
          operationId,
          expectedParentCommitHash,
          nextCommitHash,
          signer,
          issuedAt,
          expiresAt,
          signature,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        commandType:
          type: string
          enum: [CREATE_VAULT, UPDATE_PAYLOAD, PAIR_DEVICE, ROTATE_KEY]
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        expectedParentCommitHash: { $ref: "#/components/schemas/NullableBase64UrlHash32" }
        nextCommitHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        signer: { $ref: "#/components/schemas/VaultCommitAuthorV2" }
        issuedAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        expiresAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        signature: { $ref: "#/components/schemas/Base64UrlSignature64" }
    VaultCreateCommandV2:
      type: object
      additionalProperties: false
      description: Genesis snapshot and proof metadata must bind exactly to this command.
      required: [formatVersion, commandType, ownerBinding, vaultId, operationId, proof, snapshot]
      properties:
        formatVersion: { type: integer, const: 2 }
        commandType: { type: string, const: CREATE_VAULT }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        proof: { $ref: "#/components/schemas/VaultCommandProofV2" }
        snapshot: { $ref: "#/components/schemas/VaultSyncSnapshotV2" }
    VaultUpdatePayloadCommandV2:
      type: object
      additionalProperties: false
      description: |
        Advances payload and commit exactly once without changing the keyring or authorization
        manifest. Proof, parent hash, operation ID, and next snapshot must bind exactly.
      required:
        [
          formatVersion,
          commandType,
          ownerBinding,
          vaultId,
          operationId,
          proof,
          expectedParentCommitHash,
          nextSnapshot,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        commandType: { type: string, const: UPDATE_PAYLOAD }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        proof: { $ref: "#/components/schemas/VaultCommandProofV2" }
        expectedParentCommitHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        nextSnapshot: { $ref: "#/components/schemas/VaultSyncSnapshotV2" }
    VaultPairDeviceCommandV2:
      type: object
      additionalProperties: false
      description: |
        Adds exactly the approved active device, preserves the encrypted payload and existing
        active devices, and advances keyring, manifest, and commit exactly once.
      required:
        [
          formatVersion,
          commandType,
          ownerBinding,
          vaultId,
          operationId,
          proof,
          expectedParentCommitHash,
          pairedDevice,
          nextSnapshot,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        commandType: { type: string, const: PAIR_DEVICE }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        proof: { $ref: "#/components/schemas/VaultCommandProofV2" }
        expectedParentCommitHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        pairedDevice: { $ref: "#/components/schemas/DeviceDescriptorV2" }
        nextSnapshot: { $ref: "#/components/schemas/VaultSyncSnapshotV2" }
    VaultRotateKeyCommandV2:
      type: object
      additionalProperties: false
      description: |
        Atomically advances root-key identity, epoch, payload, keyring, manifest, and commit. A
        DEVICE_REVOKED reason requires a newly revoked device; RECOVERY_ROTATED requires a new
        recovery authorization key.
      required:
        [
          formatVersion,
          commandType,
          ownerBinding,
          vaultId,
          operationId,
          proof,
          expectedParentCommitHash,
          reason,
          nextSnapshot,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        commandType: { type: string, const: ROTATE_KEY }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        proof: { $ref: "#/components/schemas/VaultCommandProofV2" }
        expectedParentCommitHash: { $ref: "#/components/schemas/Base64UrlHash32" }
        reason:
          type: string
          enum: [DEVICE_REVOKED, RECOVERY_ROTATED, SCHEDULED, COMPROMISE]
        nextSnapshot: { $ref: "#/components/schemas/VaultSyncSnapshotV2" }
    DevicePairingRequestV2:
      type: object
      additionalProperties: false
      description: |
        A new non-revoked device signs this request. The request is bound to the current owner and
        vault; its lifetime is positive and at most fifteen minutes.
      required:
        [
          formatVersion,
          ownerBinding,
          vaultId,
          operationId,
          requestingDevice,
          pairingCodeCommitment,
          issuedAt,
          expiresAt,
          signature,
        ]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        operationId: { $ref: "#/components/schemas/CanonicalUuid" }
        requestingDevice: { $ref: "#/components/schemas/DeviceDescriptorV2" }
        pairingCodeCommitment: { $ref: "#/components/schemas/Base64UrlHash32" }
        issuedAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        expiresAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        signature: { $ref: "#/components/schemas/Base64UrlSignature64" }
    PairingApprovalRequestV2:
      type: object
      additionalProperties: false
      required: [pairingCodeCommitment, command]
      properties:
        pairingCodeCommitment: { $ref: "#/components/schemas/Base64UrlHash32" }
        command: { $ref: "#/components/schemas/VaultPairDeviceCommandV2" }
    DevicePairingViewV2:
      type: object
      additionalProperties: false
      description: Lifecycle timestamps are canonical and monotonic; the pairing expires no earlier than creation.
      required: [id, vaultId, requestingDevice, state, expiresAt, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/CanonicalUuid" }
        vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
        requestingDevice: { $ref: "#/components/schemas/DeviceDescriptorV2" }
        state:
          type: string
          enum: [pending, approved, consumed, expired, cancelled]
        expiresAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        createdAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
        updatedAt: { $ref: "#/components/schemas/CanonicalUtcDateTime" }
    DevicePairingPageV2:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/DevicePairingViewV2" }
    PersonalVaultBootstrapV2:
      type: object
      additionalProperties: false
      required: [formatVersion, ownerBinding, vault]
      properties:
        formatVersion: { type: integer, const: 2 }
        ownerBinding: { $ref: "#/components/schemas/OwnerBindingV2" }
        vault:
          oneOf:
            - type: object
              additionalProperties: false
              required: [exists]
              properties:
                exists: { type: boolean, const: false }
            - type: object
              additionalProperties: false
              required: [exists, vaultId, etag, recoveryAuthorization]
              properties:
                exists: { type: boolean, const: true }
                vaultId: { $ref: "#/components/schemas/CanonicalUuid" }
                recoveryAuthorization:
                  $ref: "#/components/schemas/RecoveryAuthorizationPublicKeyV2"
                etag:
                  type: string
                  minLength: 3
                  maxLength: 128
                  pattern: '^"[\x21\x23-\x7e]+"$'
    CampusId:
      type: string
      enum: [tc, duluth, crookston, morris, rochester]
    AcademicInstitutionCode:
      type: string
      enum: [UMNTC, UMNDL, UMNCR, UMNMO]
    BilingualText:
      type: object
      additionalProperties: false
      required: [en, zh-CN]
      properties:
        en: { type: string, minLength: 1 }
        zh-CN: { type: string, minLength: 1 }
    LicenseStatus:
      type: string
      enum: [OPEN_REUSE, LIVE_ONLY, DEEPLINK_ONLY, APPROVAL_REQUIRED, PROHIBITED]
    FreshnessState:
      type: string
      enum: [FRESH, STALE, EXPIRED, UNKNOWN]
    VerificationState:
      type: string
      enum: [schematic, surveyed, campus-reviewed, verified, retired]
    OfficialStatus:
      type: string
      enum: [UNVERIFIED, PUBLISHER_ASSERTED, PARTNERSHIP_VERIFIED]
    Health:
      type: object
      additionalProperties: false
      required: [status, service, version, time]
      properties:
        status: { type: string, const: ok }
        service: { type: string, const: campus-api }
        version: { type: string }
        time: { type: string, format: date-time }
    Campus:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          city,
          timeZone,
          academicInstitutionCode,
          academicCalendarCampusId,
          sourceUrl,
          officialStatus,
        ]
      properties:
        id: { $ref: "#/components/schemas/CampusId" }
        name: { $ref: "#/components/schemas/BilingualText" }
        city: { $ref: "#/components/schemas/BilingualText" }
        timeZone: { type: string }
        academicInstitutionCode: { $ref: "#/components/schemas/AcademicInstitutionCode" }
        academicCalendarCampusId: { $ref: "#/components/schemas/CampusId" }
        sourceUrl: { type: string, format: uri, pattern: "^https://" }
        officialStatus: { $ref: "#/components/schemas/OfficialStatus" }
    SourceDescriptor:
      type: object
      additionalProperties: false
      description: |
        Public source-governance record. LIVE_ONLY access is fail-closed unless authorization evidence,
        a review timestamp, and a later review expiry are all present. The review interval is validated
        by the shared contract to be no longer than 366 days. APPROVAL_REQUIRED and PROHIBITED sources
        cannot carry live-access review timestamps.
      required:
        [
          id,
          campusIds,
          resourceKinds,
          name,
          publisher,
          sourceUrl,
          licenseStatus,
          licenseEvidenceUrl,
          authorizationEvidenceUrl,
          freshnessState,
          verificationState,
          officialStatus,
          attribution,
          cachePolicy,
          cacheDisposition,
          dataClassification,
          dataClasses,
          owner,
          killSwitch,
          termsReviewedAt,
          termsReviewExpiresAt,
          lastCheckedAt,
        ]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        campusIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/CampusId" }
        resourceKinds:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum:
              [CAMPUS_DEEPLINK, ACADEMIC_SESSION, PUBLIC_EVENT, AI_KNOWLEDGE_SUMMARY, AI_VERIFICATION_LINK]
        name: { $ref: "#/components/schemas/BilingualText" }
        publisher: { type: string, minLength: 1, maxLength: 256 }
        sourceUrl: { type: string, format: uri, pattern: "^https://" }
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        licenseEvidenceUrl: { type: [string, "null"], format: uri, pattern: "^https://" }
        authorizationEvidenceUrl: { type: [string, "null"], format: uri, pattern: "^https://" }
        freshnessState: { $ref: "#/components/schemas/FreshnessState" }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
        officialStatus: { $ref: "#/components/schemas/OfficialStatus" }
        attribution: { type: string, minLength: 1, maxLength: 2048 }
        cachePolicy:
          type: string
          enum: [CACHE_ALLOWED, METADATA_ONLY, NO_CONTENT_CACHE, NO_ACCESS]
        cacheDisposition:
          type: object
          additionalProperties: false
          required: [rawResponse, normalizedRecords, derivedArtifacts, retentionSeconds]
          properties:
            rawResponse:
              type: string
              enum: [NEVER_STORE, TRANSIENT_ONLY, PERSIST_WITH_TTL]
            normalizedRecords:
              type: string
              enum: [NEVER_STORE, TRANSIENT_ONLY, PERSIST_WITH_TTL]
            derivedArtifacts:
              type: string
              enum: [PROHIBITED, SAME_RETENTION, SEPARATE_APPROVAL]
            retentionSeconds: { type: [integer, "null"], minimum: 1, maximum: 31536000 }
        dataClassification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        dataClasses:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: string
            enum:
              [
                PUBLIC_METADATA,
                COPYRIGHTED_CONTENT,
                PRECISE_LOCATION,
                PERSONAL_DATA,
                SENSITIVE_DATA,
                SAFETY_CRITICAL,
                MEDIA,
              ]
        owner:
          type: object
          additionalProperties: false
          required: [teamId, contactUrl]
          properties:
            teamId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,63}$" }
            contactUrl: { type: string, format: uri, pattern: "^https://" }
        killSwitch:
          type: object
          additionalProperties: false
          required: [key, defaultState, fallback]
          properties:
            key: { type: string, pattern: "^source\\.[a-z0-9][a-z0-9.-]{2,127}\\.enabled$" }
            defaultState: { type: string, enum: [ENABLED, DISABLED] }
            fallback: { type: string, enum: [DEEPLINK_ONLY, UNAVAILABLE] }
        termsReviewedAt: { type: [string, "null"], format: date-time }
        termsReviewExpiresAt: { type: [string, "null"], format: date-time }
        lastCheckedAt: { type: [string, "null"], format: date-time }
      allOf:
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: PROHIBITED }
          then:
            properties:
              cachePolicy: { const: NO_ACCESS }
              termsReviewedAt: { const: null }
              termsReviewExpiresAt: { const: null }
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: APPROVAL_REQUIRED }
          then:
            properties:
              cachePolicy: { const: NO_ACCESS }
              termsReviewedAt: { const: null }
              termsReviewExpiresAt: { const: null }
        - if:
            required: [licenseStatus]
            properties:
              licenseStatus: { const: LIVE_ONLY }
          then:
            properties:
              authorizationEvidenceUrl: { type: string }
              termsReviewedAt: { type: string }
              termsReviewExpiresAt: { type: string }
        - if:
            required: [termsReviewedAt]
            properties:
              termsReviewedAt: { const: null }
          then:
            properties:
              termsReviewExpiresAt: { const: null }
        - if:
            required: [termsReviewExpiresAt]
            properties:
              termsReviewExpiresAt: { const: null }
          then:
            properties:
              termsReviewedAt: { const: null }
    SourcePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/SourceDescriptor" }
    CatalogRange:
      type: object
      additionalProperties: false
      required: [defaulted, from, to]
      properties:
        defaulted: { type: boolean }
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
    CatalogCursor:
      type: string
      minLength: 45
      maxLength: 1994
      pattern: "^[A-Za-z0-9_-]{1,1950}\\.[A-Za-z0-9_-]{43}$"
    RetrievalCoverage:
      type: object
      additionalProperties: false
      required:
        [
          nextUpstreamPage,
          pagesFetched,
          recordsFetched,
          sourceTotalPages,
          sourceTotalRecords,
          truncatedByPolicy,
        ]
      properties:
        nextUpstreamPage: { type: [integer, "null"], minimum: 1, maximum: 20 }
        pagesFetched: { type: integer, minimum: 1, maximum: 3 }
        recordsFetched:
          type: integer
          minimum: 0
          maximum: 50000
          description: Sessions may contain up to 50,000 records; the events runtime is independently capped at 150 per request.
        sourceTotalPages: { type: integer, minimum: 0 }
        sourceTotalRecords: { type: integer, minimum: 0 }
        truncatedByPolicy:
          type: boolean
          description: True when the source exceeds the reviewed 20-page or 1,000-record access ceiling.
    SourceObservation:
      type: object
      additionalProperties: false
      required:
        [
          observationId,
          sourceId,
          campusId,
          observedAt,
          durationMs,
          outcome,
          httpStatus,
          parserVersion,
          rawSha256,
          rawByteLength,
          recordsAccepted,
          recordsRejected,
          freshnessState,
          licenseStatus,
          cachePolicy,
          appliedCacheDisposition,
          dataClassification,
          failureCode,
        ]
      properties:
        observationId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        campusId: { $ref: "#/components/schemas/CampusId" }
        observedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0, maximum: 120000 }
        outcome: { type: string, const: SUCCESS }
        httpStatus: { type: integer, minimum: 200, maximum: 299 }
        parserVersion: { type: string, pattern: "^[a-z0-9][a-z0-9._@/-]{0,127}$" }
        rawSha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        rawByteLength: { type: integer, minimum: 0, maximum: 10485760 }
        recordsAccepted: { type: integer, minimum: 0, maximum: 1000000 }
        recordsRejected: { type: integer, minimum: 0, maximum: 1000000 }
        freshnessState: { $ref: "#/components/schemas/FreshnessState" }
        licenseStatus: { $ref: "#/components/schemas/LicenseStatus" }
        cachePolicy:
          type: string
          enum: [CACHE_ALLOWED, METADATA_ONLY, NO_CONTENT_CACHE, NO_ACCESS]
        appliedCacheDisposition:
          type: string
          enum: [NO_ACCESS, DISCARDED_AFTER_RESPONSE, OPERATIONAL_METADATA_ONLY, CONTENT_CACHED]
        dataClassification:
          type: string
          enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
        failureCode: { type: "null" }
    PublicEventLocation:
      type: [object, "null"]
      additionalProperties: false
      required: [name, address, coordinates, onlineUrl]
      properties:
        name: { type: [string, "null"], maxLength: 512 }
        address: { type: [string, "null"], maxLength: 1024 }
        coordinates:
          type: [array, "null"]
          items: { type: number }
          minItems: 2
          maxItems: 2
        onlineUrl: { type: [string, "null"], format: uri, pattern: "^https://" }
      allOf:
        - if:
            required: [name, address, coordinates, onlineUrl]
            properties:
              name: { const: null }
              address: { const: null }
              coordinates: { const: null }
              onlineUrl: { const: null }
          then: false
    Event:
      type: object
      additionalProperties: false
      required:
        [
          id,
          campusId,
          title,
          descriptionText,
          language,
          startsAt,
          endsAt,
          allDay,
          timeZone,
          status,
          location,
          canonicalUrl,
          categories,
          sourceId,
          sourceObservationId,
          observedAt,
        ]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,255}$" }
        campusId: { $ref: "#/components/schemas/CampusId" }
        title: { type: string, minLength: 1, maxLength: 1024 }
        descriptionText: { type: [string, "null"], maxLength: 20000 }
        language:
          type: string
          pattern: "^[a-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$"
        startsAt: { type: string, format: date-time }
        endsAt: { type: [string, "null"], format: date-time }
        allDay: { type: boolean }
        timeZone: { type: string, minLength: 1, maxLength: 128 }
        status: { type: string, enum: [SCHEDULED, POSTPONED, CANCELLED] }
        location: { $ref: "#/components/schemas/PublicEventLocation" }
        canonicalUrl: { type: string, format: uri, pattern: "^https://" }
        categories:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 128 }
        sourceId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,127}$" }
        sourceObservationId:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        observedAt: { type: string, format: date-time }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, range, retrievalCoverage, sourceObservations]
      properties:
        items:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/Event" }
        nextCursor:
          type: [string, "null"]
          minLength: 45
          maxLength: 1994
          pattern: "^[A-Za-z0-9_-]{1,1950}\\.[A-Za-z0-9_-]{43}$"
        range: { $ref: "#/components/schemas/CatalogRange" }
        retrievalCoverage: { $ref: "#/components/schemas/RetrievalCoverage" }
        sourceObservations:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/SourceObservation" }
    GeoPoint:
      type: array
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    Place:
      type: object
      additionalProperties: false
      required: [id, campusId, name, location, sourceIds, verificationState]
      properties:
        id: { type: string }
        campusId: { $ref: "#/components/schemas/CampusId" }
        name: { $ref: "#/components/schemas/BilingualText" }
        location: { $ref: "#/components/schemas/GeoPoint" }
        sourceIds:
          type: array
          minItems: 1
          items: { type: string }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    PlacePage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Place" }
    RouteProfile:
      type: string
      enum: [walking, wheelchair]
    RouteRequest:
      type: object
      additionalProperties: false
