        toCampusId: { $ref: "#/components/schemas/CampusId" }
        position:
          type: array
          items: { type: number }
          minItems: 3
          maxItems: 3
        targetWorldVersion: { type: string }
        verificationState: { $ref: "#/components/schemas/VerificationState" }
    CampusWorldManifest:
      type: object
      additionalProperties: false
