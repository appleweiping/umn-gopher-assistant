asyncapi: 3.0.0
info:
  title: Campus Assistant Domain Events
  version: 0.1.0
  description: Versioned NATS JetStream contracts. Payloads contain references, not credentials or restricted source content.
servers:
  local:
    host: localhost:4222
    protocol: nats
    description: Local NATS JetStream
channels:
  sourceUpdated:
    address: source.updated.v1
    messages:
      sourceUpdated:
        $ref: "#/components/messages/SourceUpdated"
  notificationRequested:
    address: notification.requested.v1
    messages:
      notificationRequested:
        $ref: "#/components/messages/NotificationRequested"
  worldAssetPublished:
    address: world.asset.published.v1
    messages:
      worldAssetPublished:
        $ref: "#/components/messages/WorldAssetPublished"
  communityReported:
    address: community.reported.v1
    messages:
      communityReported:
        $ref: "#/components/messages/CommunityReported"
  liveRecordingStarted:
    address: live.recording.started.v1
    messages:
      liveRecordingStarted:
        $ref: "#/components/messages/LiveRecordingStarted"
operations:
  receiveSourceUpdated:
    action: receive
    channel: { $ref: "#/channels/sourceUpdated" }
    messages:
      - $ref: "#/channels/sourceUpdated/messages/sourceUpdated"
  receiveNotificationRequested:
    action: receive
    channel: { $ref: "#/channels/notificationRequested" }
    messages:
      - $ref: "#/channels/notificationRequested/messages/notificationRequested"
  receiveWorldAssetPublished:
    action: receive
    channel: { $ref: "#/channels/worldAssetPublished" }
    messages:
      - $ref: "#/channels/worldAssetPublished/messages/worldAssetPublished"
  receiveCommunityReported:
    action: receive
    channel: { $ref: "#/channels/communityReported" }
    messages:
      - $ref: "#/channels/communityReported/messages/communityReported"
  receiveLiveRecordingStarted:
    action: receive
    channel: { $ref: "#/channels/liveRecordingStarted" }
    messages:
      - $ref: "#/channels/liveRecordingStarted/messages/liveRecordingStarted"
components:
  messages:
    SourceUpdated:
      name: source.updated.v1
      title: A normalized source snapshot changed
      correlationId: { $ref: "#/components/correlationIds/TraceId" }
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload:
        allOf:
          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            required: [sourceId, campusIds, snapshotId, contentHash, freshnessState]
            properties:
              sourceId: { type: string }
              campusIds: { type: array, minItems: 1, items: { $ref: "#/components/schemas/CampusId" } }
              snapshotId: { type: string, format: uuid }
              contentHash: { type: string, pattern: "^[a-f0-9]{64}$" }
              freshnessState: { type: string, enum: [FRESH, STALE, EXPIRED, UNKNOWN] }
    NotificationRequested:
      name: notification.requested.v1
      title: A policy-approved notification is ready for delivery evaluation
      correlationId: { $ref: "#/components/correlationIds/TraceId" }
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload:
        allOf:
          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            required: [notificationId, templateId, locale, recipientReference, expiresAt]
            properties:
              notificationId: { type: string, format: uuid }
              templateId: { type: string }
              locale: { type: string, enum: [en, zh-CN] }
              recipientReference:
                {
                  type: string,
                  description: Opaque internal reference; never an email address or phone number.,
                }
              expiresAt: { type: string, format: date-time }
    WorldAssetPublished:
      name: world.asset.published.v1
      title: A world asset passed licensing and publication checks
      correlationId: { $ref: "#/components/correlationIds/TraceId" }
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload:
        allOf:
          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            required: [campusId, worldVersion, assetId, sha256, licenseStatus, verificationState]
            properties:
              campusId: { $ref: "#/components/schemas/CampusId" }
              worldVersion: { type: string }
              assetId: { type: string }
              sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
              licenseStatus:
                { type: string, enum: [OPEN_REUSE, LIVE_ONLY, DEEPLINK_ONLY, APPROVAL_REQUIRED, PROHIBITED] }
              verificationState: { type: string, enum: [SCHEMATIC, UNVERIFIED, VERIFIED, REJECTED] }
    CommunityReported:
      name: community.reported.v1
      title: Community content was reported for moderation
      correlationId: { $ref: "#/components/correlationIds/TraceId" }
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload:
        allOf:
          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            required: [moderationCaseId, targetType, targetId, reasonCodes, priority]
            properties:
              moderationCaseId: { type: string, format: uuid }
              targetType:
                { type: string, enum: [community_post, community_comment, live_session, user_profile] }
              targetId: { type: string }
              reasonCodes: { type: array, minItems: 1, items: { type: string } }
              priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT] }
    LiveRecordingStarted:
      name: live.recording.started.v1
      title: A consent-gated live recording started
      correlationId: { $ref: "#/components/correlationIds/TraceId" }
      headers: { $ref: "#/components/schemas/EventHeaders" }
      payload:
        allOf:
          - $ref: "#/components/schemas/EventEnvelope"
          - type: object
            required: [sessionId, recordingId, policyVersion, consentReceiptCount, startedAt, retentionDays]
            properties:
              sessionId: { type: string }
              recordingId: { type: string }
              policyVersion: { type: string }
              consentReceiptCount: { type: integer, minimum: 1 }
              startedAt: { type: string, format: date-time }
              retentionDays: { type: integer, minimum: 0, maximum: 3650 }
  correlationIds:
    TraceId:
      description: W3C trace identifier from event headers.
      location: $message.header#/traceId
  schemas:
    CampusId:
      type: string
      enum: [tc, duluth, crookston, morris, rochester]
    EventHeaders:
      type: object
      additionalProperties: false
      required: [eventId, traceId, schemaVersion]
      properties:
        eventId: { type: string, format: uuid }
        traceId: { type: string, pattern: "^[a-f0-9]{16,64}$" }
        schemaVersion: { type: string, const: "1" }
    EventEnvelope:
      type: object
      required: [eventId, occurredAt, producer]
      properties:
        eventId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        producer: { type: string, minLength: 1 }
