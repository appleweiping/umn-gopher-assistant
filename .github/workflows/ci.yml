name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-knowledge:
    name: Python 3.13 knowledge service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_KNOWLEDGE_INTEGRATION_DATABASE_URL: postgresql://gopher:local-postgres-password-only@127.0.0.1:5432/gopher
      COMPOSE_PROJECT_NAME: gopher-ai-ci
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.11
          cache: pip
          cache-dependency-path: |
            apps/ai-knowledge/requirements.in
            apps/ai-knowledge/requirements.txt
            apps/ai-knowledge/requirements-dev.in
            apps/ai-knowledge/requirements-dev.txt

      - name: Install locked Python dependencies
        working-directory: apps/ai-knowledge
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Lint and format-check the service
        working-directory: apps/ai-knowledge
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Build and inspect the installable wheel
        working-directory: apps/ai-knowledge
        run: |
          wheel_dir="$RUNNER_TEMP/ai-wheel"
          install_dir="$RUNNER_TEMP/ai-wheel-install"
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir "$wheel_dir" .
          python -m pip install --no-deps --target "$install_dir" "$wheel_dir"/*.whl
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$install_dir" python - <<'PY'
          from ai_knowledge.config import Settings
          from ai_knowledge.corpus import read_corpus_manifest
          from ai_knowledge.evaluation import (
              DEFAULT_CORPUS_PATH,
              DEFAULT_DATASET_PATH,
              run_evaluation,
          )

          settings = Settings.from_environment({"NODE_ENV": "test", "AI_KNOWLEDGE_BACKEND": "file"})
          manifest, corpus_hash = read_corpus_manifest(settings.corpus_path)
          assert settings.corpus_path.is_file()
          assert len(manifest.documents) == 25
          assert len(corpus_hash) == 64
          quality = run_evaluation(
              dataset_path=DEFAULT_DATASET_PATH,
              corpus_path=DEFAULT_CORPUS_PATH,
          )
          assert quality.passed
          assert quality.case_count >= 150
          PY
          )

      - name: Run unit and contract-parity tests
        working-directory: apps/ai-knowledge
        run: python -m pytest -m "not integration"

      - name: Enforce the bilingual retrieval-quality release gate
        working-directory: apps/ai-knowledge
        run: python -m ai_knowledge.evaluation

      - name: Audit runtime dependencies
        working-directory: apps/ai-knowledge
        run: |
          python -m pip check
          python -m pip_audit --requirement requirements-dev.txt --disable-pip --no-deps --progress-spinner off

      - name: Validate Compose and build the production image
        run: |
          docker compose --file infra/compose/docker-compose.yml config --quiet
          docker build --tag gopher-assistant/ai-knowledge:0.1.0 apps/ai-knowledge

      - name: Start the disposable PostgreSQL 17 database
        run: |
          docker compose --file infra/compose/docker-compose.yml up --detach --wait postgres
          docker compose --file infra/compose/docker-compose.yml run --rm --no-deps postgres-migrate

      - name: Exercise migrations, idempotent synchronization, and database invariants
        working-directory: apps/ai-knowledge
        run: python -m pytest -m integration tests/test_postgres_integration.py --no-cov

      - name: Start and probe the PostgreSQL-backed knowledge service
        run: |
          docker compose --file infra/compose/docker-compose.yml up --detach --wait ai-knowledge
          python - <<'PY'
          import json
          import hashlib
          import hmac
          import time
          import urllib.request

          with urllib.request.urlopen("http://127.0.0.1:8100/healthz", timeout=5) as response:
              health = json.load(response)
          assert health["status"] == "ok"

          body = json.dumps({
              "campusId": "tc",
              "locale": "en",
              "query": "library research help",
          }, separators=(",", ":")).encode("utf-8")
          trace_id = "ci-ai-query-0001"
          timestamp = str(int(time.time()))
          nonce = "AAAAAAAAAAAAAAAAAAAAAA"
          canonical = "\n".join((
              "POST",
              "/v1/query",
              hashlib.sha256(body).hexdigest(),
              trace_id,
              timestamp,
              nonce,
          )).encode("utf-8")
          signature = hmac.new(
              b"development-only-ai-service-hmac-key-v1", canonical, hashlib.sha256
          ).hexdigest()
          request = urllib.request.Request(
              "http://127.0.0.1:8100/v1/query",
              data=body,
              headers={
                  "Content-Type": "application/json",
                  "X-Ai-Service-Signature": signature,
                  "X-Ai-Service-Timestamp": timestamp,
                  "X-Ai-Service-Nonce": nonce,
                  "X-Request-Id": trace_id,
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=5) as response:
              result = json.load(response)
          assert result["campusId"] == "tc"
          assert result["state"] in {"answered", "stale", "conflict"}
          assert result["citations"]
          for citation in result["citations"]:
              assert "sourceId" not in citation
              assert "sourceUrl" not in citation
              assert citation["summaryVerificationState"] == "schematic"
              assert citation["summarySource"]["kind"] == "project-authored-summary"
              assert citation["summarySource"]["corpusSha256"] == health["corpusSha256"]
              assert citation["verificationLink"]["kind"] == "official-verification-link"
              assert citation["verificationLink"]["sourceUse"] == "verification-link-only"
              assert citation["verificationLink"]["contentRetrieved"] is False
          PY

      - name: Preserve AI service logs
        if: failure()
        run: docker compose --file infra/compose/docker-compose.yml logs --no-color postgres ai-knowledge-sync ai-knowledge

      - name: Remove disposable AI services and volumes
        if: always()
        run: docker compose --file infra/compose/docker-compose.yml down --volumes --remove-orphans

  verify:
    name: Node 24 verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      COMPOSE_PROJECT_NAME: gopher-api-ci
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: 24.11.1

      - name: Verify toolchain versions
        run: |
          node --version
          pnpm --version

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain policy
        run: pnpm verify:node-policy

      - name: Verify source, contracts, and tests
        run: pnpm verify:node

      - name: Build production artifacts
        run: pnpm build

      - name: Exercise retained-volume upgrades and database authority boundaries
        run: pnpm smoke:db

      - name: Start Redis for distributed limiter verification
        run: docker compose --file infra/compose/docker-compose.yml up --detach --wait redis

      - name: Exercise the atomic Redis quota boundary
        env:
          API_AI_INTEGRATION_REDIS_URL: redis://:local-redis-password-only@127.0.0.1:6379
        run: pnpm --filter @umn-gopher-assistant/api exec vitest run test/ai-rate-limiter.integration.test.ts

      - name: Build and start the PostgreSQL-backed knowledge path
        run: |
          docker compose --file infra/compose/docker-compose.yml build postgres ai-knowledge
          docker compose --file infra/compose/docker-compose.yml up --detach --wait postgres redis ai-knowledge

      - name: Exercise API to Redis to Python to PostgreSQL
        env:
          API_AI_STACK_INTEGRATION: "true"
          API_AI_KNOWLEDGE_URL: http://127.0.0.1:8100
          API_AI_REDIS_URL: redis://:local-redis-password-only@127.0.0.1:6379
        run: pnpm --filter @umn-gopher-assistant/api exec vitest run test/ai-stack.integration.test.ts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level moderate --registry=https://registry.npmjs.org

      - name: Preserve Redis failure evidence
        if: failure()
        run: >-
          docker compose --file infra/compose/docker-compose.yml logs --no-color
          postgres postgres-migrate redis ai-knowledge-sync ai-knowledge

      - name: Remove the disposable Redis service and volume
        if: always()
        run: docker compose --file infra/compose/docker-compose.yml down --volumes --remove-orphans

  browser-vault:
    name: Encrypted vault (${{ matrix.project }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser-engine: chromium
          - project: firefox
            browser-engine: firefox
          - project: webkit
            browser-engine: webkit
          - project: mobile-chromium
            browser-engine: chromium
          - project: mobile-webkit-ios26
            browser-engine: webkit
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: 24.11.1

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install browser engine
        run: pnpm --filter @umn-gopher-assistant/web exec playwright install --with-deps ${{ matrix.browser-engine }}

      - name: Exercise the vault in the selected engine
        env:
          PLAYWRIGHT_MANAGED_OFFLINE: 1
        run: pnpm --filter @umn-gopher-assistant/web test:e2e e2e/vault.spec.ts --project=${{ matrix.project }} --workers=1

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: encrypted-vault-browser-failures-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  browser-ui:
    name: Browser UI smoke
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          run_install: false
          version: 10.34.5

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          cache: pnpm
          node-version: 24.11.1

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Install browser engines
        run: pnpm --filter @umn-gopher-assistant/web exec playwright install --with-deps chromium webkit

      - name: Exercise PWA cache and privacy boundaries
        run: pnpm --filter @umn-gopher-assistant/web test:e2e e2e/pwa.spec.ts --project=chromium --workers=1

      - name: Exercise accessible vault states
        env:
          PLAYWRIGHT_SKIP_BUILD: 1
        run: pnpm --filter @umn-gopher-assistant/web test:e2e e2e/accessibility.spec.ts --project=chromium --workers=1

      - name: Exercise mobile layout boundaries
        env:
          PLAYWRIGHT_SKIP_BUILD: 1
        run: pnpm --filter @umn-gopher-assistant/web test:e2e e2e/mobile.spec.ts --project=mobile-chromium --project=mobile-webkit-ios26 --workers=1

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          if-no-files-found: ignore
          name: browser-ui-smoke-failures
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
