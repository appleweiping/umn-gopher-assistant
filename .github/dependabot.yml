version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      node-runtime:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/ai-knowledge
    schedule:
      interval: weekly
      day: monday
    groups:
      python-runtime:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /apps/ai-knowledge
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: docker
    directory: /infra/compose/postgres
    schedule:
      interval: weekly
      day: monday
